name: Release and Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          flavor: |
            latest=auto
            
      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=18
            
      - name: Generate release notes
        id: release_notes
        run: |
          echo "## Docker Image" >> release_notes.md
          echo "" >> release_notes.md
          echo "This release includes a pre-built Docker image:" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name || github.event.inputs.tag }}" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Supported Architectures" >> release_notes.md
          echo "- linux/amd64" >> release_notes.md
          echo "- linux/arm64" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Quick Start" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "# Pull the image" >> release_notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name || github.event.inputs.tag }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "# Create .env file" >> release_notes.md
          echo "curl -o .env https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.release.tag_name || github.event.inputs.tag }}/env.example" >> release_notes.md
          echo "" >> release_notes.md
          echo "# Run with docker-compose" >> release_notes.md
          echo "curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.release.tag_name || github.event.inputs.tag }}/docker-compose.yml" >> release_notes.md
          echo "docker compose up -d" >> release_notes.md
          echo '```' >> release_notes.md
          
      - name: Update release with Docker info
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releaseNotes = fs.readFileSync('release_notes.md', 'utf8');
            const currentBody = context.payload.release.body || '';
            const updatedBody = currentBody + '\n\n' + releaseNotes;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: updatedBody
            });

  create-docker-compose-artifact:
    runs-on: ubuntu-24.04
    needs: build-and-push-release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          
      - name: Create deployment package
        run: |
          mkdir -p deployment-package
          
          # Copy essential files
          cp docker-compose.yml deployment-package/
          cp env.example deployment-package/.env.example
          cp README.md deployment-package/
          cp LICENSE deployment-package/
          
          # Create a quick start script
          cat > deployment-package/quick-start.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 ERPNext Development Container Quick Start"
          echo "=========================================="
          
          # Check if docker is installed
          if ! command -v docker &> /dev/null; then
              echo "❌ Docker is not installed. Please install Docker first."
              exit 1
          fi
          
          # Check if docker compose is available
          if ! docker compose version &> /dev/null; then
              echo "❌ Docker Compose is not available. Please install Docker Compose."
              exit 1
          fi
          
          # Copy env file if it doesn't exist
          if [ ! -f .env ]; then
              echo "📝 Creating .env file from template..."
              cp .env.example .env
              echo "✅ Please edit .env file to customize your setup"
          fi
          
          echo "🐳 Starting ERPNext development container..."
          docker compose up -d
          
          echo ""
          echo "✅ Container is starting! This may take 10-15 minutes for first run."
          echo "📊 Check progress: docker compose logs -f"
          echo "🌐 Access ERPNext: http://localhost:8000"
          echo "👤 Default login: Administrator / admin"
          echo ""
          echo "🛠️  Development commands:"
          echo "  docker compose exec frappe zsh    # Open shell"
          echo "  docker compose down               # Stop container"
          echo "  docker compose logs -f            # View logs"
          EOF
          
          chmod +x deployment-package/quick-start.sh
          
          # Create archive
          tar -czf deployment-package.tar.gz -C deployment-package .
          
      - name: Upload deployment package
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./deployment-package.tar.gz
          asset_name: erpnext-dev-container-${{ github.event.release.tag_name }}.tar.gz
          asset_content_type: application/gzip
