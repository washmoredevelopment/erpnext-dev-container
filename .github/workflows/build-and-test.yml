name: Build and Test Container

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto
            
      - name: Build and test AMD64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: test-image-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=18
            
      - name: Test container startup
        run: |
          # Test that container builds and starts without critical errors
          docker run --name test-container -d \
            -e SKIP_APP_INSTALL=true \
            -e SKIP_SITE_SETUP=true \
            test-image-amd64
          
          # Wait a moment for startup
          sleep 10
          
          # Check if container is still running
          if ! docker ps | grep test-container; then
            echo "Container failed to start properly"
            docker logs test-container
            exit 1
          fi
          
          # Check health status
          docker exec test-container cat /tmp/container_health || echo "Health file not created yet"
          
          # Test shell access
          docker exec test-container zsh -c "echo 'Shell access working'"
          
          # Cleanup
          docker stop test-container
          docker rm test-container
          
      - name: Build and push multi-platform
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=18

  security-scan:
    runs-on: ubuntu-24.04
    needs: build-and-push
    if: github.event_name != 'pull_request' && !cancelled()
    permissions:
      contents: read
      packages: read
      security-events: write
    
    steps:
      - name: Extract branch name
        id: extract_branch
        run: |
          # Get branch name from ref, replace / with -
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_branch.outputs.branch }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: success()
        with:
          sarif_file: 'trivy-results.sarif'
